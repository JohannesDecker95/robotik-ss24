# Environment of the robot cell, in meters and robot base coordinates (z = 0 is the floor the
# robot stands on). Read by:
#   - pkg_solver: where pieces are provided and where the puzzle is assembled
#   - pkg_control: obstacles for the collision check
#   - visualizer: obstacles are drawn as boxes
# Pieces lie on the table tops, so the z values of the positions must match the table height.

# position where the solver provides the next piece (on the pickup table)
pickup_position: [0.9, 0.0, 0.3]

# origin of the assembled puzzle (on the puzzle table), pieces are placed in +x / -y from here
puzzle_origin: [-0.9, 0.9, 0.3]

# axis aligned boxes: center and size (x, y, z) in meters, color as RGB 0..1
obstacles:
  - {name: floor,              center: [0.25, 0.0, -0.01],     size: [3.3, 2.8, 0.02],    color: [0.82, 0.82, 0.80]}

  - {name: pickup_table_top,   center: [0.9, 0.0, 0.285],      size: [0.4, 0.4, 0.03],    color: [0.62, 0.45, 0.30]}
  - {name: pickup_table_leg_1, center: [0.735, -0.165, 0.135], size: [0.04, 0.04, 0.27],  color: [0.45, 0.32, 0.21]}
  - {name: pickup_table_leg_2, center: [1.065, -0.165, 0.135], size: [0.04, 0.04, 0.27],  color: [0.45, 0.32, 0.21]}
  - {name: pickup_table_leg_3, center: [0.735, 0.165, 0.135],  size: [0.04, 0.04, 0.27],  color: [0.45, 0.32, 0.21]}
  - {name: pickup_table_leg_4, center: [1.065, 0.165, 0.135],  size: [0.04, 0.04, 0.27],  color: [0.45, 0.32, 0.21]}

  - {name: puzzle_table_top,   center: [-0.8, 0.8, 0.285],     size: [0.5, 0.5, 0.03],    color: [0.62, 0.45, 0.30]}
  - {name: puzzle_table_leg_1, center: [-1.015, 0.585, 0.135], size: [0.04, 0.04, 0.27],  color: [0.45, 0.32, 0.21]}
  - {name: puzzle_table_leg_2, center: [-0.585, 0.585, 0.135], size: [0.04, 0.04, 0.27],  color: [0.45, 0.32, 0.21]}
  - {name: puzzle_table_leg_3, center: [-1.015, 1.015, 0.135], size: [0.04, 0.04, 0.27],  color: [0.45, 0.32, 0.21]}
  - {name: puzzle_table_leg_4, center: [-0.585, 1.015, 0.135], size: [0.04, 0.04, 0.27],  color: [0.45, 0.32, 0.21]}
